[package]
name = "assetrail"
version = "0.1.2"
description = "Destination-aware crypto withdrawal planner"
authors = ["RSI Tech <info@rsitech.ai>"]
license = "Apache-2.0"
repository = "https://github.com/rsitech-ai/asset-rail"
readme = "../README.md"
edition = "2024"
rust-version = "1.88"

[features]
default = []
test-transport = []

[lib]
name = "assetrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.89"
hex = "=0.4.3"
hmac = "=0.12.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = { version = "=1.42.1", features = ["serde-with-str"] }
schemars = { version = "=1.2.1", features = ["uuid1"] }
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.19"
time = { version = "=0.3.54", features = ["formatting", "macros", "parsing", "serde"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
proptest = "=1.11.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
trybuild = "=1.0.118"
wiremock = "=0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = "line-tables-only"
strip = "none"
