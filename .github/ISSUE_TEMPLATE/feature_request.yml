name: Feature proposal
description: Propose a focused improvement within the current read-only scope.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        AssetRail 0.1.x is an offline fixture planner. Proposals for trading, withdrawal execution, credential UI, or real-wallet data require a separate reviewed security design.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, privacy, and compatibility impact
      description: Explain any new data, permission, IPC, dependency, or public-interface requirement.
    validations:
      required: true
